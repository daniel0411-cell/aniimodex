<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#287c75"/></marker></defs><rect width="640" height="640" fill="#fcfdfb"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="320" y="43" text-anchor="middle" font-size="25" fill="#133f40" font-weight="700">答案必須匹配對應的證據類型</text><rect x="44" y="85" width="552" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="132" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">圖鑑：有日期的基礎形態記錄</text><rect x="44" y="185" width="552" height="78" rx="12" fill="#fff4df" stroke="#39877d" stroke-width="2"/><text x="320" y="232" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">不代表目前完整陣容</text><path d="M44 285 H596" stroke="#a6b6bd" stroke-width="3" fill="none"/><rect x="44" y="305" width="552" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="352" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">活動：有日期的官方公告</text><rect x="44" y="405" width="552" height="78" rx="12" fill="#fff4df" stroke="#39877d" stroke-width="2"/><text x="320" y="452" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">不代表即時伺服器或刷新監測</text><text x="320" y="557" text-anchor="middle" font-size="18" fill="#4e6373" font-weight="500">缺失資料保留未知；具體範圍以各頁面為準。</text><text x="320" y="620" text-anchor="middle" font-size="16" fill="#4e6373" font-weight="500">AniimoDex · 原創解釋圖 · 非遊戲介面</text></g></svg>
