<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#287c75"/></marker></defs><rect width="640" height="640" fill="#fcfdfb"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="320" y="43" text-anchor="middle" font-size="25" fill="#133f40" font-weight="700">證據如何形成有邊界的答案</text><rect x="44" y="85" width="552" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="132" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">來源與觀察日期</text><path d="M320 163 V198" stroke="#287c75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="61" y="203" width="518" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="250" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">判斷來源實際證明了什麼</text><path d="M320 281 V316" stroke="#287c75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="78" y="321" width="484" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="368" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">保留未知項與衝突</text><path d="M320 399 V434" stroke="#287c75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="95" y="439" width="450" height="78" rx="12" fill="#e9f5f0" stroke="#39877d" stroke-width="2"/><text x="320" y="486" text-anchor="middle" font-size="24" fill="#24394c" font-weight="500">發布答案、適用範圍與糾錯入口</text><text x="320" y="557" text-anchor="middle" font-size="18" fill="#4e6373" font-weight="500">本站編輯方法；有來源連結不代表經過實測。</text><text x="320" y="620" text-anchor="middle" font-size="16" fill="#4e6373" font-weight="500">AniimoDex · 原創解釋圖 · 非遊戲介面</text></g></svg>
