<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">領取或消費之前，先核對三步</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站編輯核對圖 · 並非領獎或商店截圖</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">1  確認具體獎勵或商品</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">閱讀道具、所用貨幣及標明的效果。</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">舊公告不代表獎勵目前仍然可領。</text><path d="M360 268 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">2  核對條件與期限</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">領取前核對帳號資格和領取期間。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">購買前核對價格、限購和失效時間。</text><path d="M360 442 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">3  對照自己的目標</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">機率不代表保證獲得指定結果。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">成本與效果未經核實，</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">就不能給出可靠的最佳消費排名。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">以目前遊戲內條款為準；本站沒有實測購買流程。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
