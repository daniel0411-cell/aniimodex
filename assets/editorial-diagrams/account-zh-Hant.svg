<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">三個帳號問題，需要分別核對</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站編輯對照圖 · 並非實測存檔轉移流程</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">一起玩？跨平台連線</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">已列出連線功能，具體平台組合需核對。</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">連線功能本身不能證明進度互通。</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">斷開關聯？解除綁定</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">已記錄 Steam / Epic 解除綁定入口。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">先保留可用登入方式，再讀確認提示。</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">解除綁定入口不能證明重新綁定規則。</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">帶走進度？跨平台存檔</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">完整轉移政策尚未確認。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">分別核對平台組合、存檔和購買內容。</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">進度缺失時使用官方私密支援管道。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">不要用解除綁定修復進度缺失；UID 等帳號資料須保密。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
