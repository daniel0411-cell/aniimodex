<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">下載：選入口、核對、排查</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站編輯說明圖 · 並非遊戲介面</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">1  選擇官方入口</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">從官網或官網連結的商店進入。</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">保留準備長期使用的帳號。</text><path d="M360 268 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">2  核對目標裝置</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">檢查產品、地區和裝置相容性。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">有商店連結不代表一定可以安裝。</text><path d="M360 442 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">3  按問題選擇下一步</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">安裝失敗：保留用戶端完整錯誤。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">進度缺失：核對登入方式和伺服器。</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">再使用對應的官方支援管道。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">官方入口、細節與例外請閱讀正文。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
