<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">免费、随机与付费优势：分开看证据</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站编辑对照图 · 三个不同的问题</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">免费游玩：基础游戏门槛</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">商店列出基础游戏免费，</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">同时披露游戏内购买。</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">随机结果：具体获取规则</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">公布概率描述的是某种结果。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">它不能单独证明道具价格，</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">也不能证明必须付费获取。</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">付费优势：消费带来的实际影响</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">需要核实成本与玩法影响。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">现有登记证据不足以可靠地</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">认定有或没有付费优势。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">营销标签不能代替对三个问题的分别核实。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
