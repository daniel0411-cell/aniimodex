<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">Three separate account questions</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">Editorial comparison • not a tested transfer procedure</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">Play together?  Crossplay</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">Multiplayer is listed; check the exact pair.</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">This does not establish shared progress.</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">Disconnect a link?  Unlink</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">Steam / Epic unlink entry is documented.</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">Keep a working login; read the prompt.</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">This does not establish relinking rules.</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">Move progress?  Cross-save</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">A complete transfer policy is unconfirmed.</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">Check platform pair, saves and purchases.</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">Missing progress: use private support.</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">Do not unlink as a repair for missing progress. Keep IDs private.</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
