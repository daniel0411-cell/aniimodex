<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">Download: choose, check, diagnose</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">Editorial decision guide • not a game interface</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">1  Choose the official route</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">Use the official website or linked store.</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">Keep the account you intend to use.</text><path d="M360 268 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">2  Check the target device</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">Confirm product, region and compatibility.</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">A store link does not guarantee access.</text><path d="M360 442 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">3  Match the problem to the next check</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">Install fails: save the exact client error.</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">Progress missing: check login and server.</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">Use the relevant official support route.</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">Read the linked guide for official routes and exceptions.</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
