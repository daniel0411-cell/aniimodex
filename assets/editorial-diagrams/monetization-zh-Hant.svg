<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">免費、隨機與付費優勢：分開看證據</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站編輯對照圖 · 三個不同的問題</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">免費遊玩：基礎遊戲門檻</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">商店列出基礎遊戲免費，</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">同時披露遊戲內購買。</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">隨機結果：具體獲取規則</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">公布機率描述的是某種結果。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">它不能單獨證明道具價格，</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">也不能證明必須付費獲取。</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">付費優勢：消費帶來的實際影響</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">需要核實成本與玩法影響。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">現有登記證據不足以可靠地</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">認定有或沒有付費優勢。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">行銷標籤不能代替對三個問題的分別核實。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
