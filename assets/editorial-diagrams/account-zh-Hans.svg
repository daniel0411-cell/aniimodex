<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">三个账号问题，需要分别核对</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站编辑对照图 · 并非实测存档转移流程</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">一起玩？跨平台联机</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">已列出联机功能，具体平台组合需核对。</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">联机功能本身不能证明进度互通。</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">断开关联？解绑</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">已记录 Steam / Epic 解绑入口。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">先保留可用登录方式，再读确认提示。</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">解绑入口不能证明重新绑定规则。</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">带走进度？跨平台存档</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">完整转移政策尚未确认。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">分别核对平台组合、存档和购买内容。</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">进度缺失时使用官方私密支持渠道。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">不要用解绑修复进度缺失；UID 等账号资料须保密。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
