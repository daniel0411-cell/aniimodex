<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">领取或消费之前，先核对三步</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">本站编辑核对图 · 并非领奖或商店截图</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">1  确认具体奖励或商品</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">阅读道具、所用货币及标明的效果。</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">旧公告不代表奖励目前仍然可领。</text><path d="M360 268 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">2  核对条件与期限</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">领取前核对账号资格和领取窗口。</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">购买前核对价格、限购和失效时间。</text><path d="M360 442 v14 m-6 -6 6 6 6 -6" stroke="#9ee4d2" stroke-width="3" fill="none"/><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">3  对照自己的目标</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">概率不代表保证获得指定结果。</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">成本与效果未经核实，</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">就不能给出可靠的最优消费排名。</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">以当前游戏内条款为准；本站没有实测购买流程。</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
