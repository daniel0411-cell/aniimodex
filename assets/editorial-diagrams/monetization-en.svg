<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><rect width="720" height="720" fill="#101b2b"/><g font-family="Arial, PingFang SC, PingFang TC, sans-serif"><text x="30" y="48" font-size="28" fill="#ffffff" font-weight="700">Free, random and pay to win: evidence</text><text x="30" y="84" font-size="20" fill="#b3c6da" font-weight="400">Editorial comparison • three different questions</text><rect x="24" y="115" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="151" font-size="25" fill="#9ee4d2" font-weight="700">Free to play: base-game access</text><text x="44" y="187" font-size="23" fill="#d8e1ed" font-weight="400">Storefronts list a free base game</text><text x="44" y="216" font-size="23" fill="#d8e1ed" font-weight="400">and disclose in-game purchases.</text><rect x="24" y="289" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="325" font-size="25" fill="#9ee4d2" font-weight="700">Random outcomes: acquisition rules</text><text x="44" y="361" font-size="23" fill="#d8e1ed" font-weight="400">A disclosed probability describes an outcome.</text><text x="44" y="390" font-size="23" fill="#d8e1ed" font-weight="400">It does not establish an item price</text><text x="44" y="419" font-size="23" fill="#d8e1ed" font-weight="400">or prove that payment is required.</text><rect x="24" y="463" width="672" height="148" rx="12" fill="#1d3048" stroke="#53758f"/><text x="44" y="499" font-size="25" fill="#9ee4d2" font-weight="700">Pay to win: effect of spending</text><text x="44" y="535" font-size="23" fill="#d8e1ed" font-weight="400">Needs verified costs and gameplay impact.</text><text x="44" y="564" font-size="23" fill="#d8e1ed" font-weight="400">Registered evidence is insufficient</text><text x="44" y="593" font-size="23" fill="#d8e1ed" font-weight="400">for a defensible yes or no.</text><text x="30" y="667" font-size="18" fill="#b3c6da" font-weight="400">A marketing label cannot settle all three questions.</text><text x="30" y="702" font-size="16" fill="#88a1ba" font-weight="400">AniimoDex • Editorial explanation / 编辑说明 / 編輯說明</text></g></svg>
